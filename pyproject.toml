[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investing-workbench"
version = "0.1.0"
description = "Investment comparison, backtesting, and research platform for B3 and global assets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.104.0",
  "httpx>=0.25.0",
  "matplotlib>=3.7.0",
  "mplfinance>=0.12.10b0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "plotly>=5.15.0",
  "pypdf>=6.0.0",
  "pyarrow>=12.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0",
  "scipy>=1.10.0",
  "statsmodels>=0.14.0",
  "uvicorn[standard]>=0.24.0",
  "yfinance>=0.2.18",
]

[project.optional-dependencies]
dev = [
  "black>=24.10.0",
  "mypy>=1.13.0",
  "pre-commit>=4.0.1",
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "ruff>=0.11.8",
  "types-PyYAML>=6.0.12.20240917",
  "types-requests>=2.32.0.20241016",
  "typer>=0.12.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]
"src/investing_workbench/application/scenarios/b3_cointegration_pairs.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -s"
filterwarnings = [
  "ignore:'DataFrame.swapaxes' is deprecated and will be removed in a future version\\.:FutureWarning:numpy\\._core\\.fromnumeric",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
files = ["src/investing_workbench"]
