# Conservative Configuration
# Mix conservador: DCA pequeno, MA cross longo, martingale light
# Benchmarks defensivos: SELIC benchmark on, IBOV on

backtest:
  initial_capital: 30000.0
  start_date: "2020-01-01"
  end_date: null
  data_source: "BTC-BRL"
  cache_path: "data/btc_brl.parquet"
  output_dir: "reports"
  apply_cash_yield: true
  use_real_selic: true
  selic_path: "data/selic.csv"
  selic_fallback_rate: 0.13
  yield_frequency: "monthly"
  include_buy_hold_benchmark: true
  include_selic_benchmark: true

  benchmarks:
    - ticker: "^BVSP"
      name: "IBOVESPA"
      enabled: true
    - ticker: "EWZ"
      name: "Brazil Small-Cap ETF"
      enabled: false

# Estratégias conservadoras focadas em preservação de capital
strategies:
  - name: "Conservative DCA"
    class_path: "strategies.dca_simple.SimpleDCAStrategy"
    parameters:
      initial_capital: 30000.0
      dca_amount: 500.0
      dca_frequency: "monthly"
      start_immediately: true

  - name: "Slow MA Cross"
    class_path: "strategies.trend_ma_cross.TrendMACrossStrategy"
    parameters:
      initial_capital: 30000.0
      short_ma_period: 30
      long_ma_period: 120
      position_size_pct: 0.6
      min_cash_reserve: 5000.0

  - name: "Mean Reversion BB"
    class_path: "strategies.mean_reversion.MeanReversionStrategy"
    parameters:
      initial_capital: 30000.0
      ma_period: 30
      use_bollinger: true
      bb_std_dev: 2.5
      entry_threshold: 0.08
      profit_target: 0.02
      position_size_pct: 0.3
      min_cash_reserve: 4000.0
      max_positions: 2

  - name: "Conservative Martingale"
    class_path: "strategies.martingale_fixed.MartingaleFixedStrategy"
    parameters:
      base_bet: 300.0
      multiplier: 1.5
      drop_step: 0.15
      take_profit: 0.25
      max_layers: 5

  - name: "Light DCA Hybrid"
    class_path: "strategies.dca_hybrid.DCAHybridStrategy"
    parameters:
      # DCA settings - conservador
      dca_amount: 400.0
      dca_frequency: "monthly"
      dca_trigger_threshold: 0.08
      moving_average_period: 60

      # Martingale settings - muito light
      base_bet: 300.0
      multiplier: 1.3
      drop_step: 0.20
      take_profit: 0.30
      max_martingale_layers: 2

plotting:
  save_plots: true
  show_plots: false
  plot_format: "png"
  dpi: 300